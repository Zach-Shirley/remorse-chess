services:
  - type: web
    # CHANGE-ME: each game names its own Render service.
    name: CHANGE-ME-game-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        # capacitor://localhost and https://localhost are the iOS and Android app shells.
        # CHANGE-ME: replace the first origin with the game's web URL.
        value: https://CHANGE-ME.example,capacitor://localhost,https://localhost
