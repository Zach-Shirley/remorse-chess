services:
  - type: web
    name: remorse-chess-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        # capacitor://localhost and https://localhost are the iOS and Android app shells.
        # The first origin is the web app. It is a guess until the site is deployed: correct it
        # to the real URL then.
        value: https://remorse-chess-five.vercel.app,capacitor://localhost,https://localhost
